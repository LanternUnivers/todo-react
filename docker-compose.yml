version: '3.9'
services:
  todo-app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - PGHOST=db
      - PGPORT=5432
      - PGUSER=todo
      - PGPASSWORD=todo
      - PGDATABASE=todo
    depends_on:
      - db
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: todo
      POSTGRES_USER: todo
      POSTGRES_PASSWORD: todo
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
